version: "3.8"
services:
  neo4j:
    image: neo4j:5.24
    container_name: neo4j-local
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/test1234
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j-data:/data
volumes:
  neo4j-data: