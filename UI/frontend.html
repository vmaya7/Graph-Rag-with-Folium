<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Restaurantes</title>
    <!-- 1. Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Carga de Font Awesome (para los iconos de Folium) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <!-- 3. Configuración de Tailwind (opcional, para fuentes) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <!-- 4. Estilos CSS personalizados -->
    <style>
        /* Estilos para el scroll del chat */
        #chat-window {
            scroll-behavior: smooth;
        }
        /* Asegurarnos que el iframe del mapa de Folium sea responsive */
        .folium-map iframe {
            width: 100%;
            height: 400px; /* Altura fija para el mapa */
            border: none;
            border-radius: 0.5rem; /* Esquinas redondeadas */
        }
    </style>
</head>
<body class="bg-gray-100 font-sans h-full flex items-center justify-center">

    <div class="flex flex-col h-full md:h-[90vh] w-full max-w-2xl bg-white shadow-2xl rounded-lg overflow-hidden my-4">
        
        <!-- Cabecera del Chat -->
        <header class="bg-gradient-to-r from-red-500 to-red-600 text-white p-4 shadow-md">
            <h1 class="text-xl font-bold text-center">🤖 Tu Asistente de Restaurantes</h1>
        </header>

        <!-- Ventana de Chat -->
        <main id="chat-window" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-50">
            <!-- Mensaje de bienvenida -->
            <div class="flex">
                <div class="flex-shrink-0 bg-red-500 rounded-full h-8 w-8 flex items-center justify-center text-white font-bold">B</div>
                <div class="ml-3 bg-gray-200 p-3 rounded-lg shadow-sm">
                    <p class="text-sm text-gray-800">¡Hola! Soy tu asistente para encontrar los mejores restaurantes en Querétaro. ¿Qué te apetece hoy?</p>
                </div>
            </div>
            <!-- Los mensajes del chat se añadirán aquí -->
        </main>

        <!-- Spinner de Carga (oculto por defecto) -->
        <div id="loading-spinner" class="hidden p-4 flex justify-center">
            <div class="flex items-center space-x-2">
                <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-red-500"></div>
                <span class="text-sm text-gray-500">Pensando...</span>
            </div>
        </div>

        <!-- Área de entrada de texto -->
        <footer class="border-t border-gray-200 p-4 bg-white">
            <form id="chat-form" class="flex items-center space-x-3">
                <input 
                    type="text" 
                    id="message-input"
                    placeholder="Escribe tu pregunta aquí..."
                    autocomplete="off"
                    class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-400 transition"
                >
                <button 
                    type="submit"
                    class="bg-red-500 text-white font-bold py-3 px-5 rounded-lg shadow hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 transition duration-200"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.875L5.999 12zm0 0h7.5" />
                    </svg>
                </button>
            </form>
            <!-- Créditos añadidos -->
            <p class="text-center text-xs text-gray-400 mt-3">
                Hecho por: Jessica y Victoria
            </p>
        </footer>
    </div>

    <!-- 5. Lógica de JavaScript -->
    <script>
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const loadingSpinner = document.getElementById('loading-spinner');

        // URL del backend (¡Asegúrate que tu backend esté corriendo en este puerto!)
        const API_URL = 'http://localhost:8000/chat';

        // Manejador del envío del formulario
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            // 1. Mostrar el mensaje del usuario
            addMessageToChat(message, 'user');
            messageInput.value = '';

            // 2. Mostrar el spinner de carga
            loadingSpinner.classList.remove('hidden');

            try {
                // 3. Enviar el mensaje al backend
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: message }),
                });

                if (!response.ok) {
                    throw new Error(`Error del servidor: ${response.statusText}`);
                }

                const data = await response.json();

                // 4. Ocultar el spinner
                loadingSpinner.classList.add('hidden');

                // 5. Mostrar la respuesta del bot
                addMessageToChat(data.answer, 'bot');

                // 6. Mostrar el mapa si existe
                if (data.map_html) {
                    addMapToChat(data.map_html);
                }

            } catch (error) {
                // 4. Ocultar el spinner en caso de error
                loadingSpinner.classList.add('hidden');
                
                // 5. Mostrar mensaje de error
                console.error('Error al contactar al backend:', error);
                addMessageToChat('Lo siento, algo salió mal al conectarme con el servidor. ¿Puedes intentarlo de nuevo?', 'bot', true);
            }
        });

        /**
         * Añade un mensaje (usuario o bot) a la ventana de chat.
         * @param {string} message - El texto del mensaje.
         * @param {'user' | 'bot'} sender - Quién envía el mensaje.
         * @param {boolean} [isError=false] - Si es un mensaje de error.
         */
        function addMessageToChat(message, sender, isError = false) {
            const messageElement = document.createElement('div');
            
            if (sender === 'user') {
                messageElement.className = 'flex justify-end';
                messageElement.innerHTML = `
                    <div class="mr-3 bg-red-500 text-white p-3 rounded-lg shadow-sm max-w-xs md:max-w-md">
                        <p class="text-sm">${message}</p>
                    </div>
                    <div class="flex-shrink-0 bg-gray-300 rounded-full h-8 w-8 flex items-center justify-center font-bold">Tú</div>
                `;
            } else {
                const bgColor = isError ? 'bg-red-100' : 'bg-gray-200';
                const textColor = isError ? 'text-red-800' : 'text-gray-800';
                
                messageElement.className = 'flex';
                messageElement.innerHTML = `
                    <div class="flex-shrink-0 bg-red-500 rounded-full h-8 w-8 flex items-center justify-center text-white font-bold">B</div>
                    <div class="ml-3 ${bgColor} p-3 rounded-lg shadow-sm max-w-xs md:max-w-md">
                        <p class="text-sm ${textColor}">${message}</p>
                    </div>
                `;
            }
            
            chatWindow.appendChild(messageElement);
            // Hacer scroll hacia el último mensaje
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        /**
         * Añade el mapa de Folium al chat.
         * @param {string} mapHtml - El HTML del mapa.
         */
        function addMapToChat(mapHtml) {
            const mapContainer = document.createElement('div');
            mapContainer.className = 'flex justify-center p-2';
            
           const mapWrapper = document.createElement('div');
            // antes: 'folium-map w-full ...'
            mapWrapper.className = 'map-shell w-full max-w-lg rounded-lg shadow-lg overflow-hidden border border-gray-200';

            const iframe = document.createElement('iframe');
            iframe.srcdoc = mapHtml;
            iframe.sandbox = 'allow-scripts allow-same-origin';
            iframe.style.width = '100%';
            iframe.style.height = '300px'; // igual que el back-end
            iframe.style.border = 'none';

            mapWrapper.appendChild(iframe);
            mapContainer.appendChild(mapWrapper);
            chatWindow.appendChild(mapContainer);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

    </script>
</body>
</html>
